};

const STATUS_COLOR = {
  Pending: COLORS.amber,
  Checking: COLORS.blue,
  Done: COLORS.green,
  Rejected: COLORS.red,
};
function statusColor(status) {
  return STATUS_COLOR[status] || COLORS.gray;
}

const STATUS_ORDER = ["Pending", "Checking", "Done", "Rejected"];

const RANGES = [
  { key: "today", label: "Today" },
  { key: "yesterday", label: "Yesterday" },
  { key: "7d", label: "Last 7 Days" },
  { key: "30d", label: "Last 30 Days" },
  { key: "thisMonth", label: "This Month" },
  { key: "lastMonth", label: "Last Month" },
];
const DAY = 24 * 60 * 60 * 1000;

function inRange(date, key, now) {
  if (!date) return false;
  if (key === "today") return date.toDateString() === now.toDateString();
  if (key === "yesterday") {
    const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    return date.toDateString() === y.toDateString();
  }
  if (key === "7d") {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
    return date >= start && date <= now;
  }
  if (key === "30d") {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
    return date >= start && date <= now;
  }
  if (key === "thisMonth") return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
  if (key === "lastMonth") {
    const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return date.getFullYear() === lm.getFullYear() && date.getMonth() === lm.getMonth();
  }
  return true;
}

function safeDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

// Resolving/Acknowledgement Duration columns in this sheet are stored in SECONDS.
function parseSeconds(v) {
  if (v == null || v === "") return null;
  const n = parseFloat(String(v).trim());
  return isNaN(n) ? null : n;
}

function formatDurationSec(totalSeconds) {
  if (totalSeconds == null || isNaN(totalSeconds)) return "—";
  totalSeconds = Math.round(totalSeconds);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const mins = Math.floor((totalSeconds % 3600) / 60);
  const secs = totalSeconds % 60;
  if (days > 0) return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  if (mins > 0) return `${mins}m ${secs}s`;
  return `${secs}s`;
}

function formatDateStacked(date) {
  if (!date) return { d: "—", t: "" };
  const d = date.toLocaleDateString("en-CA"); // YYYY-MM-DD
  const t = date.toLocaleTimeString("en-PH", { hour12: false });
  return { d, t };
}

function isUrl(v) {
  return typeof v === "string" && /^https?:\/\//i.test(v.trim());
}

function parseRow(row, index) {
  const submittedAt = safeDate(row["Submitted At"]);
  const acknowledgedAt = safeDate(row["Acknowledged At"]);
  const resolvedAt = safeDate(row["Resolved At"]);
  const status = (row["Status"] || "").trim() || "Pending";
  const resolvingSec = parseSeconds(row["Resolving Duration"]) ??
    (resolvedAt && submittedAt ? (resolvedAt - submittedAt) / 1000 : null);
  const ackSec = parseSeconds(row["Acknowledgement Duration"]);

  return {
    id: row["Ticket ID"] || `ROW-${index + 1}`,
    username: row["Username"] || "Unknown",
    status,
    priority: (row["Priority"] || "NORMAL").toUpperCase(),
    category: row["Category"] || "",
    concernType: row["Subcategory"] || "—",
    timeframe: row["Timeframe"] || "",
    referenceNumber: row["Reference Number"] || "",
    amount: row["Amount"] || "",
    reason: row["Reason"] || "",
    notes: row["Notes"] || "",
    receiptLink: row["Receipt Link"] || "",
    acknowledgedBy: row["Acknowledged By"] || "",
    acknowledgedAt,
    resolvedBy: row["Resolved By"] || "",
    resolvedAt,
    remarks: row["Remarks"] || "",
    submittedAt,
    resolvingSec,
    ackSec,
  };
}

function parseDelayRow(row, index) {
  return {
    id: `DLY-${index + 1}`,
    timestamp: safeDate(row["Timestamp"]),
    username: row["Username"] || "Unknown",
    transactionNumber: row["Transaction Number"] || "",
    amount: row["Amount"] || "",
    gateway: row["Gateway"] || "",
    transactionTime: row["Transaction Time"] || "",
  };
}

function DelayForm({ onSubmit, submitting, setSubmitting, submitMsg, setSubmitMsg }) {
  const empty = { username: "", transactionNumber: "", amount: "", gateway: "", transactionTime: "" };
  const [form, setForm] = useState(empty);

  const update = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const isValid = form.username.trim() && form.transactionNumber.trim() && form.amount.trim() && form.gateway.trim() && form.transactionTime.trim();

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!isValid || submitting) return;
    setSubmitting(true);
    setSubmitMsg("");
    try {
      await onSubmit(form);
      setForm(empty);
      setSubmitMsg("success");
    } catch (err) {
      setSubmitMsg(err.message || "error");
    } finally {
      setSubmitting(false);
    }
  };

  const inputStyle = { width: "100%", background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 7, padding: "9px 11px", fontSize: 13, color: COLORS.text };
  const labelStyle = { fontSize: 12, color: COLORS.textFaint, marginBottom: 5, display: "block", fontWeight: 600 };

  return (
    <form onSubmit={handleSubmit} style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
      <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.text, marginBottom: 3 }}>Report a Delay (More than 24 Hours)</div>
      <div style={{ fontSize: 12, color: COLORS.textFaint, marginBottom: 16 }}>Fill out for deposits delayed more than 24 hours. This gets logged to the shared tracker below.</div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14, marginBottom: 14 }}>
        <div>
          <label style={labelStyle}>Username</label>
          <input style={inputStyle} value={form.username} onChange={update("username")} placeholder="e.g. juandelacruz" required />
        </div>
        <div>
          <label style={labelStyle}>Transaction Number</label>
          <input style={inputStyle} value={form.transactionNumber} onChange={update("transactionNumber")} placeholder="e.g. TXN-88213" required />
        </div>
        <div>
          <label style={labelStyle}>Amount</label>
          <input style={inputStyle} type="number" step="0.01" value={form.amount} onChange={update("amount")} placeholder="e.g. 1500.00" required />
        </div>
        <div>
          <label style={labelStyle}>Gateway</label>
          <input style={inputStyle} value={form.gateway} onChange={update("gateway")} placeholder="e.g. GCash, Maya, Bank" required />
        </div>
        <div>
          <label style={labelStyle}>Transaction Time</label>
          <input style={inputStyle} type="datetime-local" value={form.transactionTime} onChange={update("transactionTime")} required />
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <button type="submit" disabled={!isValid || submitting}
          style={{ background: COLORS.orange, color: "#241900", border: "none", borderRadius: 7, padding: "9px 18px", fontSize: 13, fontWeight: 700, cursor: (!isValid || submitting) ? "default" : "pointer", opacity: (!isValid || submitting) ? 0.6 : 1 }}>
          {submitting ? "Submitting..." : "Submit Report"}
        </button>
        {submitMsg === "success" && <span style={{ fontSize: 12, color: COLORS.green }}>Naitala na. Lalabas sa listahan sa ibaba sa loob ng ilang segundo.</span>}
        {submitMsg && submitMsg !== "success" && <span style={{ fontSize: 12, color: COLORS.red }}>{submitMsg}</span>}
      </div>
    </form>
  );
}

function DepositDashboard() {
  const now = useMemo(() => new Date(), []);
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [lastSynced, setLastSynced] = useState(null);

  const [range, setRange] = useState("7d");
  const [customFrom, setCustomFrom] = useState("");
  const [customTo, setCustomTo] = useState("");
  const [activeCustom, setActiveCustom] = useState(null);

  const [statusFilter, setStatusFilter] = useState("All");
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [page, setPage] = useState("dashboard");

  const [delayRows, setDelayRows] = useState([]);
  const [delayLoading, setDelayLoading] = useState(false);
  const [delayError, setDelayError] = useState("");
  const [delayLastSynced, setDelayLastSynced] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [submitMsg, setSubmitMsg] = useState("");

  const loadSheet = useCallback(async () => {
    setLoading(true);
    setError("");
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}&_=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      const rows = (parsed.data || []).map((row, i) => parseRow(row, i));
      setTickets(rows);
      setLastSynced(new Date());
    } catch (e) {
      setError("Hindi ma-load ang sheet. Siguraduhing 'Anyone with the link' ang access, at tama ang sheet tab name.");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { loadSheet(); }, [loadSheet]);

  const loadDelays = useCallback(async () => {
    setDelayLoading(true);
    setDelayError("");
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(DELAY_TAB)}&_=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      const rows = (parsed.data || []).map((row, i) => parseDelayRow(row, i));
      setDelayRows(rows);
      setDelayLastSynced(new Date());
    } catch (e) {
      setDelayError("Hindi ma-load ang DELAYS tab. Siguraduhing gumawa ka na ng tab na 'DELAYS' sa parehong sheet.");
    } finally {
      setDelayLoading(false);
    }
  }, []);

  useEffect(() => { loadDelays(); }, [loadDelays]);

  const submitDelay = useCallback(async (formData) => {
    if (!APPS_SCRIPT_URL) {
      throw new Error("Hindi pa na-configure ang APPS_SCRIPT_URL sa config. Sundin ang setup instructions.");
    }
    const body = new URLSearchParams(formData);
    await fetch(APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", body });
    await new Promise((r) => setTimeout(r, 1200));
    await loadDelays();
  }, [loadDelays]);

  const scoped = useMemo(() => {
    return tickets.filter((t) => {
      if (activeCustom) {
        if (!t.submittedAt) return false;
        return t.submittedAt >= activeCustom.from && t.submittedAt <= activeCustom.to;
      }
      return inRange(t.submittedAt, range, now);
    });
  }, [tickets, range, now, activeCustom]);

  const filtered = useMemo(() => {
    return scoped.filter((t) => {
      if (statusFilter !== "All" && t.status !== statusFilter) return false;
      if (query.trim()) {
        const q = query.toLowerCase();
        return t.id.toLowerCase().includes(q) || t.username.toLowerCase().includes(q);
      }
      return true;
    });
  }, [scoped, statusFilter, query]);

  const stats = useMemo(() => {
    const total = scoped.length;
    const done = scoped.filter((t) => t.status === "Done").length;
    const rejected = scoped.filter((t) => t.status === "Rejected").length;
    const pending = scoped.filter((t) => t.status === "Pending" || t.status === "Checking").length;
    const withRes = scoped.filter((t) => t.resolvingSec != null);
    const avgSec = withRes.length ? withRes.reduce((s, t) => s + t.resolvingSec, 0) / withRes.length : null;
    return { total, done, rejected, pending, avgSec };
  }, [scoped]);

  const selectedTicket = filtered.find((t) => t.id === selectedId) || null;

  const delayCount = delayRows.length;

  const handleSearch = () => {
    if (customFrom && customTo) {
      const from = new Date(customFrom + "T00:00:00");
      const to = new Date(customTo + "T23:59:59");
      setActiveCustom({ from, to });
    }
  };
  const handleClear = () => {
    setCustomFrom(""); setCustomTo(""); setActiveCustom(null);
    setQuery(""); setStatusFilter("All"); setRange("7d");
  };

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh", fontFamily: "'Inter', -apple-system, sans-serif", color: COLORS.text, display: "flex" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #232D44; border-radius: 4px; }
        input:focus, select:focus { outline: none; border-color: #F5A623 !important; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        tr:hover td { background: rgba(255,255,255,0.02); }
      `}</style>

      <Sidebar page={page} setPage={setPage} delayCount={delayCount} />

      <div style={{ flex: 1, minWidth: 0 }}>
      {page === "pending" ? (
        <DelayTransactionsView
          rows={delayRows}
          loading={delayLoading}
          error={delayError}
          onRefresh={loadDelays}
          lastSynced={delayLastSynced}
          onSubmit={submitDelay}
          submitting={submitting}
          setSubmitting={setSubmitting}
          submitMsg={submitMsg}
          setSubmitMsg={setSubmitMsg}
        />
      ) : (
      <div style={{ maxWidth: 1300, margin: "0 auto", padding: "24px 24px 60px" }}>
        <div style={{ marginBottom: 18 }}>
          <h1 style={{ fontSize: 22, fontWeight: 700, margin: 0, color: COLORS.orange }}>Cash In — Transaction Request Tickets</h1>
          <div style={{ fontSize: 13, color: COLORS.textFaint, marginTop: 4 }}>Overview and tracking for deposit concern tickets</div>
        </div>

        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: 12, marginBottom: 18, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: error ? COLORS.red : COLORS.green, flexShrink: 0 }} />
          <div style={{ fontSize: 13, color: error ? COLORS.red : COLORS.textMuted, flex: "1 1 260px" }}>
            {error ? error : tickets.length ? `Connected — ${tickets.length} tickets${lastSynced ? ` · synced ${lastSynced.toLocaleTimeString()}` : ""}.` : "Connecting to Google Sheet…"}
          </div>
          <button onClick={loadSheet} disabled={loading} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.orange, color: "#241900", border: "none", borderRadius: 7, padding: "7px 13px", fontSize: 13, fontWeight: 700, cursor: loading ? "default" : "pointer", opacity: loading ? 0.7 : 1 }}>
            <RefreshCw size={13} className={loading ? "spin" : ""} />
            {loading ? "Refreshing..." : "Refresh"}
          </button>
        </div>

        {tickets.length === 0 ? (
          <div style={{ border: `1px dashed ${COLORS.border}`, borderRadius: 10, padding: "50px 20px", textAlign: "center", color: COLORS.textFaint, fontSize: 13 }}>
            {loading ? "Loading tickets…" : error ? "Hindi pa nakakonekta." : "Walang tickets sa sheet."}
          </div>
        ) : (
          <>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 18 }}>
              <StatCard label="Total Tickets" value={stats.total} />
              <StatCard label="Done" value={stats.done} accent={COLORS.green} sub={`${stats.total ? Math.round((stats.done / stats.total) * 100) : 0}% of total`} />
              <StatCard label="Rejected" value={stats.rejected} accent={COLORS.red} sub={`${stats.total ? Math.round((stats.rejected / stats.total) * 100) : 0}% of total`} />
              <StatCard label="Pending / Checking" value={stats.pending} accent={COLORS.amber} />
              <StatCard label="Avg. Resolution Time" value={formatDurationSec(stats.avgSec)} accent={COLORS.orange} />
            </div>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
              {RANGES.map((r) => (
                <button key={r.key} onClick={() => { setRange(r.key); setActiveCustom(null); setCustomFrom(""); setCustomTo(""); }}
                  style={{ border: `1px solid ${(!activeCustom && range === r.key) ? COLORS.orange : COLORS.border}`, borderRadius: 7, padding: "7px 13px", fontSize: 12.5, fontWeight: 500, cursor: "pointer", background: (!activeCustom && range === r.key) ? "rgba(245,166,35,0.12)" : COLORS.surface, color: (!activeCustom && range === r.key) ? COLORS.orange : COLORS.textMuted }}>
                  {r.label}
                </button>
              ))}
            </div>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 18 }}>
              <div style={{ position: "relative", flex: "1 1 220px" }}>
                <Search size={14} color={COLORS.textFaint} style={{ position: "absolute", left: 10, top: 10 }} />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search username or ticket ID..."
                  style={{ width: "100%", background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 7, padding: "8px 10px 8px 30px", fontSize: 13, color: COLORS.text }} />
              </div>
              <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}
                style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 7, padding: "8px 10px", fontSize: 13, color: COLORS.text }}>
                <option value="All">All Statuses</option>
                {STATUS_ORDER.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
              <span style={{ fontSize: 12, color: COLORS.textFaint }}>From</span>
              <input type="date" value={customFrom} onChange={(e) => setCustomFrom(e.target.value)}
                style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 7, padding: "7px 9px", fontSize: 13, color: COLORS.text, colorScheme: "dark" }} />
              <span style={{ fontSize: 12, color: COLORS.textFaint }}>To</span>
              <input type="date" value={customTo} onChange={(e) => setCustomTo(e.target.value)}
                style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 7, padding: "7px 9px", fontSize: 13, color: COLORS.text, colorScheme: "dark" }} />
              <button onClick={handleSearch} style={{ background: COLORS.orange, color: "#241900", border: "none", borderRadius: 7, padding: "8px 16px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Search</button>
              <button onClick={handleClear} style={{ background: "transparent", color: COLORS.textMuted, border: `1px solid ${COLORS.border}`, borderRadius: 7, padding: "8px 16px", fontSize: 13, cursor: "pointer" }}>Clear</button>
            </div>

            <div style={{ fontSize: 12, color: COLORS.textFaint, marginBottom: 8 }}>
              Showing {filtered.length} ticket{filtered.length === 1 ? "" : "s"}
            </div>

            <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 10, overflow: "hidden" }}>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 800 }}>
                  <thead>
                    <tr style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                      {["Ticket ID", "Username", "Status", "Priority", "Concern Type", "Submitted At", "Resolution Time"].map((h) => (
                        <th key={h} style={{ textAlign: "left", padding: "10px 16px", fontSize: 11, color: COLORS.textFaint, textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 600 }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length === 0 ? (
                      <tr><td colSpan={7} style={{ padding: "40px 20px", textAlign: "center", color: COLORS.textFaint, fontSize: 13 }}>
                        <AlertTriangle size={18} style={{ marginBottom: 8 }} /><div>Walang tickets na tumugma sa filter na ito.</div>
                      </td></tr>
                    ) : (
                      filtered.map((t) => (
                        <React.Fragment key={t.id}>
                          <TicketRow ticket={t} isSelected={t.id === selectedId} onClick={() => setSelectedId(t.id === selectedId ? null : t.id)} />
                          {t.id === selectedId && <DetailRow ticket={t} />}
                        </React.Fragment>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </>
        )}
      </div>
      )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DepositDashboard />);
</script>
</body>
</html>
